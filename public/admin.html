<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Front Desk — Admin</title>
<link rel="stylesheet" href="admin.css" />
</head>
<body>

  <!-- LOGIN -->
  <section id="screen-login" class="screen active">
    <form id="login-form" class="login-card">
      <h1>Admin Sign-in</h1>
      <p class="sub">Enter the admin password to continue.</p>
      <input id="login-password" type="password" autocomplete="off" placeholder="Password" />
      <button id="login-submit" type="submit" class="btn btn-primary">Sign In</button>
      <p id="login-error" class="error hidden"></p>
    </form>
  </section>

  <!-- DASHBOARD -->
  <section id="screen-dashboard" class="screen">
    <header class="topbar">
      <span class="logo">🛎️ Virtual Front Desk — Admin</span>
      <div class="topbar-right">
        <span id="totals-summary" class="totals-summary"></span>
        <button id="btn-open-change-password" class="icon-btn" type="button" title="Change admin password">⚙</button>
        <button id="btn-refresh" class="btn-small">Refresh</button>
        <button id="btn-sign-out" class="btn-small">Sign out</button>
      </div>
    </header>

    <main class="layout">
      <section class="panel panel-full">
        <h2>Password reset requests <span id="reset-requests-badge" class="count-badge hidden">0</span></h2>
        <div id="reset-requests-list" class="agents-list">
          <p class="empty-note">No pending requests.</p>
        </div>
      </section>

      <section class="panel">
        <h2>Agents</h2>
        <div id="agents-list" class="agents-list"></div>

        <form id="add-agent-form" class="add-agent-form">
          <h3>Add agent</h3>
          <div class="add-agent-row">
            <input id="new-agent-name" type="text" placeholder="Name" maxlength="60" />
            <input id="new-agent-password" type="text" placeholder="Password" maxlength="60" />
            <button type="submit" class="btn btn-primary">Add</button>
          </div>
          <p id="add-agent-error" class="error hidden"></p>
        </form>
      </section>

      <section class="panel">
        <h2>Performance</h2>
        <p id="stats-note" class="stats-note"></p>
        <div id="stats-table" class="stats-table"></div>
      </section>
    </main>
  </section>

  <!-- CHANGE PASSWORD -->
  <div id="change-password-modal" class="modal-overlay hidden">
    <form id="change-password-form" class="modal-card">
      <h2>Change admin password</h2>
      <p class="sub">Update the password used to sign in to this dashboard.</p>
      <div class="modal-field">
        <label for="cp-current">Current password</label>
        <input id="cp-current" type="password" autocomplete="current-password" maxlength="60" />
      </div>
      <div class="modal-field">
        <label for="cp-new">New password</label>
        <input id="cp-new" type="password" autocomplete="new-password" maxlength="60" />
      </div>
      <div class="modal-field">
        <label for="cp-confirm">Confirm new password</label>
        <input id="cp-confirm" type="password" autocomplete="new-password" maxlength="60" />
      </div>
      <p id="change-password-error" class="error hidden"></p>
      <p id="change-password-success" class="hint hidden"></p>
      <div class="modal-actions">
        <button type="button" id="btn-cancel-change-password" class="btn btn-secondary">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>

  <script src="admin.js"></script>
</body>
</html>
